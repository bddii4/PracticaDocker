services:
  angular-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REPO_URL: https://github.com/bddii4/Practicagit.git
        BRANCH: main
        APP_NAME: Practicagit
    image: angular-nginx-app:1.0
    container_name: angular-nginx-app
    ports:
      - "8080:80"
    restart: unless-stopped
